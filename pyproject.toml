[project]
name = "forms-with-rag"
version = "0.1.0"
description = "Beta version of justforms plataform"
authors = [
    {name = "AcSsalazar",email = "acsalazar@unal.edu.co"}
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "Django==5.0.9",
    "dj-database-url (>=3.1.2,<4.0.0)",
    "django-cors-headers (>=4.9.0,<5.0.0)",
    "django-environ (>=0.11.0,<0.14.0)",
    "django-storages (>=1.14.6,<2.0.0)",
    "djangorestframework (>=3.17.1,<4.0.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)",
    "django-cms (>=5.0.7,<6.0.0)",
    "django-filer (>=3.4.4,<4.0.0)",
    "django-select2 (>=8.4.8,<9.0.0)",
    "django-import-export (>=4.4.1,<5.0.0)",
    "djangocms-frontend (>=2.4.0,<3.0.0)",
    "djangocms-text-ckeditor (>=5.1.7,<6.0.0)",
    # LLM / ML libraries are optional; install with `poetry install -E ml`
    
    "numpy==1.26.4",
    "scikit-learn==1.5.2",
    "scipy==1.14.1",
    "gunicorn (>=26.0.0,<27.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "pydantic-settings (>=2.14.1,<3.0.0)",
    "python-decouple (>=3.8,<4.0)",
    "django-ckeditor (>=6.7.3,<7.0.0)"
]

[project.optional-dependencies]
# Optional ML/LLM dependencies (install with `poetry install -E ml`)
ml = [
    "openai==2.37.0",
    "torch==2.12.0",
    "transformers==5.8.1",
    "tiktoken==0.13.0",
    "tokenizers==0.22.2"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
